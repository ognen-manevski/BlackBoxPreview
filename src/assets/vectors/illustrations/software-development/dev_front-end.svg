<?xml version="1.0" encoding="UTF-8"?>
<svg id="ui" xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 1200">
  <defs>
    <style>

      :root{
        --fill-color : yellow;
        --stroke-color: #ff0000;
      }

      .cls-1, .cls-2, .cls-3 {
        fill: none;
      }

      .cls-2 {
        fill-rule: evenodd;
      }

      .cls-2, .cls-3 {
        stroke: var(--stroke-color);
        stroke-miterlimit: 10;
        stroke-width: 5px;
      }

      .cls-4 {
        clip-path: url(#clippath);
      }


      #cursor{
        transition: transform 0.5s ease;
        fill: var(--fill-color);
      }

      svg:hover #cursor{
        transform: translate(-50px, -100px);
      }

      svg:hover #arrow{
        transform: translate(20px, 0px);
        animation: arrow-anim 1.4s ease infinite;
      }

      svg:hover #arrow-2{
        animation: arrow-2-anim 1.4s ease infinite;
      }

      @keyframes arrow-anim {
        0% {
          transform: translate(0px, 0px);
        }
        50% {
          transform: translate(20px, 0px);
        }
        100% {
          transform: translate(0px, 0px);
        }
      }

      @keyframes arrow-2-anim {
        0% {
          transform: translate(0px, 0px);
        }
        50% {
          transform: translate(-20px, 0px);
        }
        100% {
          transform: translate(0px, 0px);
        }
      }

      #sun, #mountain {
        transition: transform 0.5s ease;
        transform-origin: left center;
      }


      svg:hover #sun, svg:hover #mountain {
        transform: translate(-20px, 0px) scale(1.05);
      }


      #text-line {
        --x: 745.79211px;
        --width: 385.42105px;
        --dist: 30px;
        --delay: 0s;
      }

      #text-line-2 {
        --x: 903.79047px;
        --width: 227.42269px;
        --dist: 30px;
        --delay: 0.6s;
      }

      #text-line-3 {
        --x: 903.79047px;
        --width: 227.42269px;
        --dist: 30px;
        --delay: 0.2s;
      }

      #text-line-4 {
        --x: 903.79047px;
        --width: 227.42269px;
        --dist: 30px;
        --delay: 0.4s;
      }

      svg:hover #text-line,
      svg:hover #text-line-2,
      svg:hover #text-line-3,
      svg:hover #text-line-4 {
        animation: text-line-anim 1.4s ease infinite;
        animation-delay: var(--delay);
      }

      @keyframes text-line-anim {
        0%,
        100% {
          x: var(--x);
          width: var(--width);
        }

        50% {
          x: calc(var(--x) + var(--dist));
          width: calc(var(--width) - var(--dist));
        }
      }




      #_1 {
        --delay: 0s;
      }
      #_2 {
        --delay: 0.1s;
      }
      #_3 {
        --delay: 0.2s;
      }

      svg:hover #_1,
      svg:hover #_2,
      svg:hover #_3 {
        animation: dots-blink 1s step-start infinite;
        animation-delay: var(--delay);
      }

      @keyframes dots-blink {
        0%,
        100%{
          opacity: 1;
        }

        50% {
          opacity: 0;
        }
      }





    </style>
    <clipPath id="clippath">
      <rect class="cls-1" x="239.15068" y="285.24917" width="447.37974" height="264.72438"/>
    </clipPath>
  </defs>
