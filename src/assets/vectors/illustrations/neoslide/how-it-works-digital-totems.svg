  <defs>
    <style>
      .d-demo-chart {
        stroke: var(--border-color);
        fill: var(--bg-secondary);
        vector-effect: non-scaling-stroke;
      }

      .e-demo-chart {
        stroke: var(--color-brand);
        fill: none;
        vector-effect: non-scaling-stroke;
      }

      .ico-border {
        stroke: var(--color-brand);
        fill: var(--icon-bg);
        vector-effect: non-scaling-stroke;
      }

      .path-demo-chart {
        fill: none;
        stroke-width: 1px;
        stroke: var(--color-brand);
        stroke-dasharray: 4px 2px;
        vector-effect: non-scaling-stroke;
        animation: connector-flow-dchart 3s linear infinite;
      }

      .path-demo-chart-fast {
        animation-duration: 1.8s;
      }

      @keyframes connector-flow-dchart {
        0% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -20;
        }
      }

      .f-demo-chart {
        fill: var(--text-secondary);
        font-family: Roboto-Regular, Roboto;
        font-size: 13px;
      }

      .i-demo-chart {
        font-size: 18px;
      }

      .j-demo-chart {
        font-size: 16px;
      }

      .top-title {
        fill: var(--text-primary);
        font-family: Roboto-Bold, Roboto;
        font-size: 16px;
        font-weight: 700;
      }

      .i-demo-chart, .j-demo-chart {
        fill: var(--text-primary);
        font-family: Roboto-Bold, Roboto;
        font-weight: 700;
      }

      .b-demo-chart {
        fill: url(#chart-gradient);
      }
    </style>

    <radialGradient id="chart-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--color-brand)" stop-opacity="1" />
      <stop offset="80%" stop-color="var(--color-brand)" stop-opacity="0" />
    </radialGradient>
  </defs>
