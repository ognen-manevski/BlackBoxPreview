<?xml version="1.0" encoding="UTF-8"?>
<svg id="backend" xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200">
  <defs>
    <style>


      :root{
        --fill-color: #0000ff;
        --stroke-color: #ff0000;
      }


      .cls-1 {
        stroke-dasharray: 10 10;
      }

      .cls-1, .cls-2, .cls-3 {
        fill: none;
        stroke: #000;
        stroke-miterlimit: 10;
        stroke-width: 5px;
      }

      .cls-2 {
        fill-rule: evenodd;
      }

      <!-- fill bg -->

      #server-bg, #db-body-fill, #cloud-bg{
        fill: var(--fill-color);
      }




      <!-- wifi -->

      #s-1, #s-2, #s-3{
        transform-box: fill-box;
        transform-origin: center;
      }

      svg:hover #s-1,
      svg:hover #s-2,
      svg:hover #s-3{
        animation: wifi-anim var(--duration) step-start infinite;
        animation-delay: var(--delay);
      }

      #s-3{
        --duration: 2s;
        --delay: 0s;
      }

      #s-2{
        --duration: 2s;
        --delay: 0.1s;
      }

      #s-1{
        --duration: 2s;
        --delay: 0.2s;
      }


      @keyframes wifi-anim {
        0%, 55%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      <!-- dots blink -->

      #server-1, #db-1{
        --delay-parent: 0s;
      }

      #server-2, #db-2{
        --delay-parent: 0.1s;
      }

      #server-3, #db-3{
        --delay-parent: 0.2s;
      }


      .c-1 {
        --delay-local: 0s;
      }
      .c-2 {
        --delay-local: 0.1s;
      }
      .c-3 {
        --delay-local: 0.2s;
      }

      svg:hover .c-1,
      svg:hover .c-2,
      svg:hover .c-3 {
        animation: dots-blink 1s step-start infinite;
        animation-delay: calc(var(--delay-local) + var(--delay-parent, 0s));
      }

      @keyframes dots-blink {
        0%,
        100%{
          opacity: 1;
        }

        50% {
          opacity: 0;
        }
      }

      <!-- lock -->

      #lock{
        transform-box: fill-box;
        transform-origin: center;
      }

      svg:hover #lock{
        animation: hover-anim 2s ease-in-out infinite;
      }


      @keyframes hover-anim {
        0%, 100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-20px);
        }
      }

      <!-- cloud  -->

      #cloud{
        transform-box: fill-box;
        transform-origin: center;
      }

      svg:hover #cloud{
        animation: hover-anim 3s ease-in-out infinite;
      }

      <!-- text  -->

      #tx-lines-1{
        --delay: 0s;
      }

      #tx-lines-2{
        --delay: 0.2s;
      }

      .tx-line{
        transform-box: fill-box;
        transform-origin: right center;
      }

      svg:hover .tx-line{
        animation: tx-line-anim 2s ease-in-out infinite;
        animation-delay: var(--delay);
      }

      @keyframes tx-line-anim {
        0%, 100% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(0.5);
        }
      }


    </style>
  </defs>


