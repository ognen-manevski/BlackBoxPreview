<?xml version="1.0" encoding="UTF-8"?>
<svg id="app" xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 1200">
  <defs>
    <style>


      :root{
        --fill-color: var(--color-brand);
        --stroke-color: var(--icon-bg);
      }


      .cls-1, .cls-2, .cls-3 {
        fill: none;
      }

      .cls-2 {
        fill-rule: evenodd;
      }

      .cls-2, .cls-3 {
        stroke: var(--stroke-color);
        stroke-miterlimit: 10;
        stroke-width: 5px;
      }

      .cls-4 {
        clip-path: url(#clippath-ca);
      }

      #hand, #arrow{
        fill: var(--fill-color);
      }

      svg:hover #hand{
        animation: hand-anim 4s ease infinite;
      }

      @keyframes hand-anim {
        0%,
        100% {
          transform: translate(0px, 0px);
        }
        50% {
          transform: translate(0px, -200px);
        }
      }

      svg:hover #info-popup{
        animation: info-popup-anim 4s ease-in-out infinite;
      }

      @keyframes info-popup-anim {
        0%,
        100% {
          transform: translate(0px, 0px);
        }
        50% {
          transform: translate(0px, -150px);
        }
      }

      #app-1, #app-2{
        transform-box: fill-box;
        transform-origin: center;
      }

      svg:hover #app-1 {
        animation: app-1-hover-anim 4s ease infinite;
      }

      @keyframes app-1-hover-anim {
        0%, 20%, 70%, 100% {
          transform: translateY(0) rotate(0deg);
        }

        30%, 60% {
          transform: translateY(-20px) rotate(-5deg);
        }
      }

      svg:hover #app-2 {
        transform-box: fill-box;
        transform-origin: center;
        animation: app-2-hover-anim 4s ease infinite;
      }

      @keyframes app-2-hover-anim {
        0%, 10%, 80%, 100% {
          transform: translateY(20px) rotate(5deg);
        }

        20%, 70% {
          transform: translateY(0) rotate(0deg);
        }
      }

      #signal{
        r: 0px;
      }

      svg:hover #signal{
        --r: 62.23889px;
        animation: signal-anim 4s ease infinite;
      }

      @keyframes signal-anim {
        0%{
          r: 0px;
        }
        100% {
          r: 400px;
        }
      }

      #s-1, #s-2, #s-3{
        transform-box: fill-box;
        transform-origin: center;
      }

      #s-3{
        --duration: 2s;
        --delay: 0s;
      }

      #s-2{
        --duration: 2s;
        --delay: 0.1s;
      }

      #s-1{
        --duration: 2s;
        --delay: 0.2s;
      }

      svg:hover #s-1, svg:hover #s-2, svg:hover #s-3{
        animation: wifi-anim var(--duration) step-start infinite;
        animation-delay: var(--delay);
      }


      @keyframes wifi-anim {
        0%, 55%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

    </style>
    <clipPath id="clippath-ca">
