  <defs>
    <style>
      .d, .ff {
        stroke: var(--color-brand);
        stroke-dasharray: 4px 2px;
        animation: connector-flow 3s linear infinite;
      }

      .d, .e, .f, .g {
        fill: none;
      }

      .d, .f, .g {
        stroke-miterlimit: 10;
      }


      .i {
        opacity: .2;
      }

      .i, .j {
        fill: var(--color-brand);
      }

      .l {
        font-size: 18px;
      }

      .l, .m {
        fill: var(--text-primary);
        font-family: Roboto-Bold, Roboto;
        font-weight: 700;
      }

      .n {
        fill: var(--text-secondary);
        font-family: Roboto-Regular, Roboto;
        font-size: 13px;
      }

      .o {
        fill: url(#c);
      }

      .r {
        fill: var(--surface);
      }


      .f {
        stroke: var(--border-color);
      }

      .ff{
        fill: none;
        stroke-offset: -10px;
      }

      .grp:hover .f{
        stroke: var(--color-brand);
      }

      .g {
        stroke: var(--color-brand);
      }

      .m {
        font-size: 16px;
      }

    @keyframes connector-flow {
    0% {
      stroke: var(--border-color);
      stroke-dashoffset: 0;
    }
    50% {
      stroke: color-mix(in srgb, var(--color-brand) 65%, var(--border-color));
    }
    100% {
      stroke: var(--border-color);
      stroke-dashoffset: -12;
    }
  }
    </style>
  </defs>
  
  
  

